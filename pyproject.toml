[project]
name = "agentpass"
version = "0.1.0"
description = "Aide-commerce: scoped identity, per-call MCP tool enforcement and mid-task revocation for AI shopping agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.9",
    "cedarpy>=4.0",
    "mcp>=1.20,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
